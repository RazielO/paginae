name: Android CI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Clojure tools
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.5.1664

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Compile ClojureDart into Dart
        run: clj -M:cljd compile

      - name: Generate icons
        run: dart run flutter_launcher_icons

      - name: Decode signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > release-keystore.jks

      - name: Create Android signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/release-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Get latest build-tools version
        id: buildtools
        run: |
          VERSION=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' |
            sort -V |
            tail -n 1)

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Using Android Build Tools $VERSION"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$VERSION/apksigner" verify \
            --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: |
          mv \
            build/app/outputs/flutter-apk/app-release.apk \
            paginae.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: paginae.apk

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f release-keystore.jks
          rm -f android/key.properties

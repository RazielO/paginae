name: cljd_paginae
description: "App to track reading"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # HTTP requests
  http: ^1.6.0

  # Barcode reader
  mobile_scanner: ^7.4.0

  # Material symbols
  material_symbols_icons: ^4.2960.0

  # String localizations
  flutter_localizations:
    sdk: flutter
  intl: any

  # Dotted border
  dotted_border: ^3.1.0

  # Image picker
  image_picker: ^1.2.3
  
  # Path provider
  path_provider: ^2.1.6

  # uuid
  uuid: ^4.6.0

  # sqlite
  sqflite: ^2.4.3

  # path
  path: ^1.9.1

  # image
  image: ^4.9.2

  # carousel
  carousel_slider: ^5.1.2

  # share
  share_plus: ^13.3.0

  # calendar
  table_calendar: ^3.2.1

  # key-value store
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Icon
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"

flutter:
  generate: true

  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 200
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 800

    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/NotoSerif-Italic-VariableFont_wdth,wght.ttf
          style: italic

  assets:
    - assets/icon/icon.png
    - assets/sql/schema.sql
